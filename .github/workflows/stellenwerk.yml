name: Stellenwerk to Telegram

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  send-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Send Stellenwerk jobs to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "-1004179589286"
        run: python stellenwerk_telegram.py
